name: CD - galax.interop.gala

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "galax-interop-gala-v*"
    paths:
      - "packages/galax.interop.gala/**"
      - ".github/workflows/cd-galax-interop-gala.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  build:
    name: Build & inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from tags.
          fetch-depth: 0
          persist-credentials: false
          # Pin to the triggering commit: a queued job would otherwise
          # re-resolve `github.ref` to main's tip.
          ref: ${{ github.sha }}

      - name: Validate git tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          # Through `env`, never `${{ }}` inside `run`: a tag name is supplied
          # by anyone who can push one, and `${{ }}` is substituted before bash
          # parses the line, so a crafted tag would break out of the quotes.
          GITHUB_REF_VAR: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF_VAR#refs/tags/}"
          python scripts/validate_tag.py "$TAG" "galax.interop.gala"
        shell: bash

      - uses: hynek/build-and-inspect-python-package@v3
        with:
          path: packages/galax.interop.gala
          upload-name-suffix: -galax.interop.gala
