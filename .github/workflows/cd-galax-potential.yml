name: CD - galax.potential

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "galax-potential-v*"
    paths:
      - "packages/galax.potential/**"
      - ".github/workflows/cd-galax-potential.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  build:
    name: Build & inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags.
          fetch-depth: 0
          persist-credentials: false
          # Pin to the triggering commit: a queued job would otherwise
          # re-resolve `github.ref` to main's tip.
          ref: ${{ github.sha }}

      - name: Validate git tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Through `env`, never `${{ }}` inside `run`: a tag name is supplied
          # by anyone who can push one, and `${{ }}` is substituted before bash
          # parses the line, so a crafted tag would break out of the quotes.
          GITHUB_REF_VAR: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF_VAR#refs/tags/}"
          python scripts/validate_tag.py "$TAG" "galax.potential"
        shell: bash

      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          path: packages/galax.potential
          upload-name-suffix: -galax.potential
