name: CI full
permissions:
  contents: read

# Adding the `full-ci` label to an open, non-draft PR runs all of CI, macOS and
# Windows included, on the PR's current head, so a PR can get the full check
# without a new push. A draft runs them when it is marked ready, since the
# label is then in the normal CI run. This is a separate workflow so that
# adding any other label starts nothing in CI and never replaces or cancels the
# PR's `CI Pass` check. Its own checks (`ci / ...`) are advisory: they are not
# required, so a failure there does not block merging.
on:
  pull_request:
    types: [labeled]

jobs:
  ci:
    if: >-
      github.event.label.name == 'full-ci' && !github.event.pull_request.draft
      && github.event.pull_request.state == 'open'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
