name: CI
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files
        env:
          # Not a real commit -- no-commit-to-branch would always fail here.
          SKIP: no-commit-to-branch

  # Where there's smoke, there's fire!
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install the project
        # Every extra, deliberately. `tests/smoke/test_interop_registration.py
        # ::test_entry_point_is_registered` asserts all eight entry points
        # across all four interop distributions, and a plain sync installs only
        # the astropy one -- five of those cases would fail. Do not narrow this
        # to `--group test` and then make the test skip absent distributions:
        # that restores the exact hole it exists to close, since a dropped
        # entry point raises no error, the interop just silently stops working.
        run: uv sync --extra all --group test
      - name: Run smoke test
        run: uv run pytest tests/smoke -ra

  install-shapes:
    name: Install shapes
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs needs tags to compute versions for the built wheels.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Check the bare and subset install shapes
        run: ./scripts/check_install_shapes.sh

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [smoke]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        # macOS runners bill at 10x the Linux rate (and run ~3x slower
        # wall-clock for this JAX-heavy suite even with the same xdist
        # settings -- 3 workers vs Linux's 4, but each core is also slower);
        # Windows bills at 2x. Both Python versions are already fully
        # exercised on Linux, so re-running both on macOS/Windows is
        # cross-OS coverage, not cross-version coverage -- one version per
        # non-Linux OS still catches a platform-specific break. Pinned to the
        # newest version so it doubles as "does the latest Python work here".
        # Matches the pattern in unxt's CI.
        exclude:
          - runs-on: macos-latest
            python-version: "3.12"
          - runs-on: windows-latest
            python-version: "3.12"

        # TODO: figure out OpenBLAS install
        #   ``ERROR: Dependency "OpenBLAS" not found, tried pkgconfig and cmake``
        # include:
        #   - python-version: pypy-3.11
        #     runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --group test

      # `packages` whole, not an enumeration. A plain sync installs only the
      # members the root requires, and `conftest.py`'s `collect_ignore_glob`
      # already drops each `packages/galax.interop.<lib>/*` tree whose library
      # or distribution is missing -- so naming members individually buys
      # nothing and costs a hand-edit per portion. Forgetting that edit drops a
      # portion's doctests from every leg of this matrix and fails nothing,
      # which is the silence this repo keeps paying for.
      - name: Test package
        run: >-
          uv run pytest src packages docs tests/unit tests/functional -ra --cov
          --cov-report=xml --cov-report=term --durations=20 --arraydiff -m"not
          slow" -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  check_interop:
    name: Check Interoperability
    runs-on: ${{ matrix.runs-on }}
    needs: [smoke]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra all --group test-all

      - name: Test package
        run: >-
          uv run pytest src packages docs tests/unit tests/functional -ra
          --durations=20 --cov --cov-report=xml --cov-report=term --arraydiff
          -m"not slow" --mpl --mpl-hash-library=hashes.json --mpl-deterministic
          -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    needs: [pre-commit]
    if:
      github.event_name == 'workflow_dispatch' || (github.event_name ==
      'pull_request' && contains(github.event.pull_request.labels.*.name,
      'run-benchmarks')) || (github.event_name == 'push' && github.ref ==
      'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --group test

      - name: Run benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: "instrumentation"
          # Instrumentation mode runs under Valgrind, whose x87 emulation gives
          # `numpy.longdouble` a bit signature numpy does not recognise, so
          # importing `numpy.ma` warns. `filterwarnings = ["error"]` turns that
          # into an exception during session start, aborting the whole run with
          # an INTERNALERROR before a single benchmark is collected. The warning
          # says nothing about galax, so ignore it here rather than repo-wide,
          # where it would still flag a genuinely broken numpy build.
          run:
            uv run pytest tests/benchmark --codspeed -W
            "ignore:Signature:UserWarning"

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [pre-commit, smoke, install-shapes, checks, check_interop, benchmark]
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # benchmark only runs on workflow_dispatch / the run-benchmarks label /
          # push to main (see its `if:`), so it's intentionally skipped on most PRs.
          allowed-skips: benchmark
