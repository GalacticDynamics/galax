ci:
  # pre-commit.ci runs every hook over every file on its own runners and autofixes by
  # pushing a commit. The graph is not byte-reproducible across platforms, so a rebuild
  # there would push a reshuffled graph into every branch.
  skip: [graphify-update]
  autoupdate_schedule: "quarterly"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2024.08.19
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-added-large-files
        # The committed code graph is a few megabytes of generated JSON.
        exclude: ^graphify-out/graph\.json$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        # graphify writes no trailing newline; adding one makes the hook and the
        # rebuild rewrite the file in turn, for ever.
        exclude: ^graphify-out/graph\.json$
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # Test-support modules (optional-dependency probes, the agama
        # comparison helper, the action-angle and variational test helpers, the
        # gala reference-data script), not test files.
        exclude: ^packages/galax\.(potential/tests/unit/potential/optional_deps|potential/tests/integration/agama/_compare|dynamics/tests/dynamics/(optional_deps|_variational_helpers)|actionangle/tests/actionangle/(optional_deps|_helpers|_o2gf_ref|data/make_o2gf_gala_refs))\.py$
      - id: no-commit-to-branch
        args: ["--branch", "main", "--pattern", "^versions/.*"]
        always_run: true
        # Restrict to pre-commit so a push (e.g. a release tag) isn't mistaken for a commit.
        stages: [pre-commit]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.8.6"
    hooks:
      # Run the linter
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes", "--ignore", "TC00"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.19.1"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.4.2"
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        # The graph is one long line by design; reformatting it to hundreds of
        # thousands destroys the diff and merge properties it is committed for.
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.14.1"
    hooks:
      - id: mypy
        # Anchored at the distribution source roots. The previous `files: src`
        # matched these paths too -- it is an unanchored regex, so "src" matched
        # inside `packages/<dist>/src/...` -- but with no top-level `src/` left
        # it read as dead config and was reported as such twice. Both patterns
        # check the same 188 files; this one says so.
        files: ^packages/[^/]+/src/
        additional_dependencies:
          # `boundinstance` supplies `InstanceDescriptor`, which two plotting
          # descriptors subclass. Without it here the hook's isolated env sees
          # `Any` and reports "Class cannot subclass value of type Any".
          - boundinstance
          - dataclassish
          - optype
          - plum-dispatch>=2.5.7
          - quax

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.3.0"
    hooks:
      - id: codespell
        exclude: ^(notebooks|AUTHORS\.rst|graphify-out/graph\.json)$
        additional_dependencies:
          - tomli

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # - repo: https://github.com/abravalheri/validate-pyproject
  #   rev: "v0.23"
  #   hooks:
  #     - id: validate-pyproject
  #       additional_dependencies: ["validate-pyproject-schema-store[all]"]

  # Keeps the committed code graph (graphify-out/graph.json) in step with the code.
  # Like a formatter: if the graph changed, stage it and commit again.
  # Skip once with `SKIP=graphify-update git commit ...`.
  - repo: local
    hooks:
      - id: graphify-update
        name: graphify update
        language: python
        additional_dependencies: ["graphifyy==0.9.119"]
        entry: env PYTHONHASHSEED=0 graphify update . --force
        pass_filenames: false
        # Without this a commit that only deletes files reports "no files to check",
        # skips, and leaves the deleted code in the graph.
        always_run: true
        # `default_stages` includes pre-push; without this the hook runs a second full
        # rebuild on every push, which can only repeat what this one already enforced.
        stages: [pre-commit]
