[project]
authors = [
  { name = "galax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
# Two galax dependencies, both downward. Not `galax` -- depending on the root
# would recreate the `galax` <-> portion cycle. `galax.dynamics` is used only by
# the tests and doctests, so it is in the `test` group below, not here.
dependencies = [
  "coordinax>=0.24.3,<0.25",
  "equinox>=0.13.8",
  "galax.coordinates",
  "galax.potential",
  "jax>=0.7.2",
  "jaxtyping>=0.3.3",
  "numpy>=2.0",
  "plum>=2.8.0; python_version < '3.14'",
  "plum>=2.9.0; python_version >= '3.14'",
  "quaxed>=0.10.5",
  "unxt>=2.0.5,<3",
]
description = "Action-angle coordinates for galax"
dynamic = ["version"]
license = "MIT"
name = "galax.actionangle"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Homepage = "https://github.com/GalacticDynamics/galax"

# Workspace members, so resolve them locally instead of from PyPI, where the
# names are still unclaimed.
[tool.uv.sources]
"galax.coordinates" = { workspace = true }
"galax.dynamics" = { workspace = true }
"galax.potential" = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[dependency-groups]
# The root `pyproject.toml` forces most of this, not this portion's imports:
# `--arraydiff` and `env` come from `[tool.pytest.ini_options]`, and the root
# `conftest.py` imports `sybil` and `optional_dependencies` at module level, so
# every run rooted at the repo loads them whatever it collects.
test = [
  # Test-only: no `src/` module imports it. The `_src/api.py` doctest and the
  # tests integrate orbits with it to feed the estimators.
  "galax.dynamics",
  "optional-dependencies>=0.4.0",
  "pytest>=8.3",
  "pytest-arraydiff>=0.6.1",
  "pytest-cov>=5",
  "pytest-env>=1.1.5",
  "pytest-xdist>=3.6.1",
  "sybil>=9.0.0",
]

[tool.hatch.build.targets.wheel]
# `galax` is a shared namespace directory; this package owns only the
# `actionangle` leaf. Named explicitly because a namespace directory cannot be
# auto-detected.
packages = ["src/galax"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
root = "../.."
search_parent_directories = true

# The version-file hook is safe here, unlike at the repo root: this path is a
# leaf owned outright by this distribution, not a shared namespace directory.
[tool.hatch.build.hooks.vcs]
version-file = "src/galax/actionangle/_version.py"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "galax-actionangle-v[0-9]*",
]
