[project]
authors = [
  { name = "galax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dependencies = [
  "astropy>=7.0.0",
  "gala>=1.10",
  "packaging>=24.1",
  "galax.coordinates",
  # Strictly greater: galax 0.0.3 itself ships `galax/interop/` content, so
  # pairing it with this distribution would write the same files twice. The
  # portion pins carry no floor because those names are still unclaimed on
  # PyPI; they get one at the first coordinated release.
  "galax.interop.astropy>0.0.3",
  "galax.potential",
  "plum>=2.8.0; python_version < '3.14'",
  "plum>=2.9.0; python_version >= '3.14'",
  "unxt>=2.0.5,<3",
  "unxts.interop.gala>=2.0,<3",
]
description = "Gala interoperability for galax"
dynamic = ["version"]
license = "MIT"
name = "galax.interop.gala"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Homepage = "https://github.com/GalacticDynamics/galax"

# Loading an entry point imports the module, which performs the plum dispatch
# registrations as an import side effect. The consuming portion calls
# `load_interop_plugins("galax.<portion>.interop")`; it never names this package.
[project.entry-points."galax.coordinates.interop"]
gala = "galax.interop.gala.coordinates"

[project.entry-points."galax.potential.interop"]
gala = "galax.interop.gala.potential"

# Workspace members, so resolve them locally instead of from PyPI, where the
# names are still unclaimed.
[tool.uv.sources]
"galax.coordinates" = { workspace = true }
"galax.potential" = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[dependency-groups]
# The root `pyproject.toml` forces most of this, not this portion's imports:
# `--arraydiff` and `env` come from `[tool.pytest.ini_options]`, and the root
# `conftest.py` imports `sybil` and `optional_dependencies` at module level, so
# every run rooted at the repo loads them whatever it collects.
test = [
  "optional-dependencies>=0.4.0",
  "pytest>=8.3",
  "pytest-arraydiff>=0.6.1",
  "pytest-cov>=5",
  "pytest-env>=1.1.5",
  "pytest-xdist>=3.6.1",
  "sybil>=9.0.0",
]

[tool.hatch.build.targets.wheel]
# `galax` and `galax/interop` are shared namespace directories; this package
# owns only the leaf. Named explicitly because a namespace directory cannot be
# auto-detected.
packages = ["src/galax"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
root = "../.."
search_parent_directories = true

# The version-file hook is safe here, unlike at the repo root: this path is a
# leaf owned outright by this distribution, not a shared namespace directory.
[tool.hatch.build.hooks.vcs]
version-file = "src/galax/interop/gala/_version.py"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "galax-interop-gala-v*",
]
