[project]
authors = [
  { name = "galax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dependencies = [
  # Upper bound: beartype 0.23.0 (2026-10-10) raises "UnionTypeHint
  # (typing.Union) subscripted by no subhint-unique child type hints" from
  # `beartype.door` when `plum` compares type hints, so `import coordinax`
  # fails outright -- no galax code is involved. Lift once upstream fixes it.
  "beartype>=0.22.9,<0.23",
  "astropy>=7.0.0",
  "galax.interop.astropy>0.0.3",
  "galax.potential",
  "galpy>=1.8",
  "plum>=2.8.0; python_version < '3.14'",
  "plum>=2.9.0; python_version >= '3.14'",
  "unxt>=2.0.5,<3",
]
description = "Galpy interoperability for galax"
dynamic = ["version"]
license = "MIT"
name = "galax.interop.galpy"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Homepage = "https://github.com/GalacticDynamics/galax"

[project.entry-points."galax.potential.interop"]
galpy = "galax.interop.galpy.potential"

# A workspace member, so resolve it locally instead of from PyPI, where the
# name is still unclaimed.
[tool.uv.sources]
"galax.potential" = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/galax"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
root = "../.."
search_parent_directories = true

# The version-file hook is safe here, unlike at the repo root: this path is a
# leaf owned outright by this distribution, not a shared namespace directory.
[tool.hatch.build.hooks.vcs]
version-file = "src/galax/interop/galpy/_version.py"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "galax-interop-galpy-v*",
]
