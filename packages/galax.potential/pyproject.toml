[project]
authors = [
  { name = "galax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
# Exactly one galax dependency: `galax.coordinates`. Not `galax`, which would
# recreate the metadata cycle phase 2 exists to dissolve, and not
# `galax.dynamics`, which sits above this portion in the import graph.
#
# `astropy` is a REQUIRED dependency, not an extra: `_src/base.py` imports `G`
# and `Quantity` at module scope, so a bare `import galax.potential` needs it.
#
# `numpy` and `quax-blocks` are imported directly by this portion but are
# declared nowhere in the repository root, so these two floors are DERIVED, not
# copied: `numpy>=1.26` is the oldest release supporting Python 3.12, this
# project's `requires-python` floor; `quax-blocks>=0.5` is the version `uv.lock`
# resolves, and its `NumpyMathMixin` is a base class of the public
# `ConstantParameter`. The root's omission is tracked separately.
dependencies = [
  # Upper bound: beartype 0.23.0 (2026-10-10) raises "UnionTypeHint
  # (typing.Union) subscripted by no subhint-unique child type hints" from
  # `beartype.door` when `plum` compares type hints, so `import coordinax`
  # fails outright -- no galax code is involved. Lift once upstream fixes it.
  "beartype>=0.22.9,<0.23",
  "astropy>=7.0.0",
  "boundinstance>=0.1",
  "coordinax>=0.24.1,<0.25",
  "dataclassish>=0.8.0",
  "equinox>=0.13.8",
  "galax.coordinates",
  "interpax>=0.3.11",
  "is-annotated>=1.0",
  "jax>=0.7.2",
  "jaxtyping>=0.3.3",
  "numpy>=1.26",
  "optype>=0.14.0",
  "plotting_backends>=0.1",
  "plum>=2.8.0; python_version < '3.14'",
  "plum>=2.9.0; python_version >= '3.14'",
  "quax>=0.4.3",
  "quax-blocks>=0.5",
  "quaxed>=0.10.5",
  "spexial>=0.2.1",
  "typing-extensions>=4.13.2",
  "unxt>=2.0.5,<3",
  "unxts.parametric>=2.0,<3",
  "wadler_lindig>=0.1.7",
  "xmmutablemap>=0.2.1",
  "zeroth>=1.2.0",
]
description = "Gravitational potentials for galax"
dynamic = ["version"]
license = "MIT"
name = "galax.potential"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Homepage = "https://github.com/GalacticDynamics/galax"

# `galax.coordinates` is a workspace member, so resolve it locally instead of
# from PyPI, where the name is still unclaimed.
[tool.uv.sources]
"galax.coordinates" = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[tool.hatch.build.targets.wheel]
# `galax` is a shared namespace directory; this package owns only the
# `potential` leaf. Named explicitly because a namespace directory cannot be
# auto-detected.
packages = ["src/galax"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
root = "../.."
search_parent_directories = true

# The version-file hook is safe here, unlike at the repo root: this path is a
# leaf owned outright by this distribution, not a shared namespace directory.
[tool.hatch.build.hooks.vcs]
version-file = "src/galax/potential/_version.py"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "galax-potential-v[0-9]*",
]
