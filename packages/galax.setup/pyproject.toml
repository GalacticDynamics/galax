[project]
authors = [
  { name = "galax Devs", email = "nstarman@users.noreply.github.com" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
# No galax dependency: this distribution sits below every portion, which are to
# depend on it. Not `galax` -- depending on the root would recreate the `galax`
# <-> portion cycle.
dependencies = ["jaxtyping>=0.3.3"]
description = "Shared package setup helpers for galax"
dynamic = ["version"]
license = "MIT"
name = "galax.setup"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Homepage = "https://github.com/GalacticDynamics/galax"

[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[dependency-groups]
# The root `pyproject.toml` forces most of this, not this portion's imports:
# `--arraydiff` and `env` come from `[tool.pytest.ini_options]`, and the root
# `conftest.py` imports `sybil` and `optional_dependencies` at module level, so
# every run rooted at the repo loads them whatever it collects.
#
# `astropy` is not imported by this distribution. The root `filterwarnings`
# names an `astropy` warning class, which pytest must import to apply the
# filter; every other portion gets `astropy` through `unxt`, this one has no
# such dependency.
test = [
  "astropy>=7.0.0",
  "optional-dependencies>=0.4.0",
  "pytest>=8.3",
  "pytest-arraydiff>=0.6.1",
  "pytest-cov>=5",
  "pytest-env>=1.1.5",
  "pytest-xdist>=3.6.1",
  "sybil>=9.0.0",
]

[tool.hatch.build.targets.wheel]
# `galax` is a shared namespace directory; this package owns only the
# `setup` leaf. Named explicitly because a namespace directory cannot be
# auto-detected.
packages = ["src/galax"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
root = "../.."
search_parent_directories = true

# The version-file hook is safe here, unlike at the repo root: this path is a
# leaf owned outright by this distribution, not a shared namespace directory.
[tool.hatch.build.hooks.vcs]
version-file = "src/galax/setup/_version.py"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "galax-setup-v[0-9]*",
]
