[project]
name = "galax"
description = "Galactic Dynamics in Jax."
dynamic = ["version"]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "galax maintainers", email = "nstarman@users.noreply.github.com" },
  { name = "Adrian Price-Whelan", email = "adrianmpw@gmail.com" },
  { name = "Jake Nibauer", email = "jnibauer@princeton.edu" },
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "astropy>=7.0.0",
  "beartype>=0.22.9",                      # TODO: figure out why 0.22.0 breaks things
  "coordinax>=0.23.3,<0.24",
  "dataclassish>=0.8.0",
  "diffrax>=0.7",
  "diffraxtra>=1.5.2",
  "equinox>=0.13.8",
  "interpax>=0.3.11",
  "is-annotated>=1.0",
  "jax>=0.7.2",
  "jaxlib>=0.7.2",
  "jaxtyping>=0.3.3",
  "oncequinox>=0.1.0",
  "optimistix>=0.0.11",
  "optional-dependencies>=0.4.0",
  "optype>=0.14.0",
  "packaging>=24.1",
  "plotting_backends>=0.1",
  "plum>=2.8.0; python_version < '3.14'",
  "plum>=2.9.0; python_version >= '3.14'",
  "quax>=0.4.3",
  "quaxed>=0.10.5",
  "tfp-nightly[jax]>=0.25.0",
  "typing-extensions>=4.13.2",
  "unxt>=1.11.2,<2",
  "wadler_lindig>=0.1.7",
  "xmmutablemap>=0.2.1",
  "zeroth>=1.2.0",
]

[project.optional-dependencies]
# All runtime dependencies
all = ["galax[interop-all,plot-all]"]
# Interoperability dependencies
interop-all = [
  "galax[interop-astropy]",
  "galax[interop-gala]",
  "galax[interop-galpy]",
]
interop-astropy = ["astropy>=6.1"]
interop-gala = ["gala>=1.10", "galax[interop-astropy]"]
interop-galpy = ["galax[interop-astropy]", "galpy >= 1.8"]
# TODO: agama
plot-all = ["galax[plot-matplotlib]"]
plot-matplotlib = ["matplotlib>=3.8"]

[project.urls]
"Bug Tracker" = "https://github.com/GalacticDynamics/galax/issues"
Changelog = "https://github.com/GalacticDynamics/galax/releases"
Discussions = "https://github.com/GalacticDynamics/galax/discussions"
Homepage = "https://github.com/GalacticDynamics/galax"

# Interoperability plugins. Each portion loads its own group at the end of its
# `__init__`; importing a registered module performs its `plum` dispatch
# registration. Groups are per-portion so that importing `galax.coordinates`
# does not drag in potential-level interop. A plugin whose third-party target
# is not installed is skipped by the loader.
[project.entry-points."galax.coordinates.interop"]
astropy = "galax.interop.astropy.coordinates"
gala = "galax.interop.gala.coordinates"

[project.entry-points."galax.potential.interop"]
astropy = "galax.interop.astropy.potential"
gala = "galax.interop.gala.potential"
galpy = "galax.interop.galpy.potential"
matplotlib = "galax.interop.matplotlib.potential"

[project.entry-points."galax.dynamics.interop"]
astropy = "galax.interop.astropy.dynamics"
matplotlib = "galax.interop.matplotlib.orbit"


[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]


[dependency-groups]
# Development dependencies
dev = [
  "cz-conventional-gitmoji>=0.6.1",
  "ipykernel>=6.29.5",
  "pre-commit>=4.0.1",
  "uv>=0.6.4",
  { include-group = "docs" },
  { include-group = "test-all" },
]
# Documentation dependencies
docs = [
  "furo>=2024.8.6",
  "myst_parser>=4.0",
  "sphinx>=8.1",
  "sphinx_autodoc_typehints>=2.5",
  "sphinx_copybutton>=0.5.2",
]
# Test dependencies
test-all = [{ include-group = "test" }, { include-group = "test-mpl" }]
test = [
  "nox>=2024.10.9",
  "pre-commit>=4.0.1",
  "pytest-arraydiff>=0.6.1",
  "pytest-codspeed>=3.2.0",
  "pytest-cov>=5",
  "pytest>=8.3",
  "sybil>=9.0.0",
  "pytest-env>=1.1.5",
]
test-mpl = ["pytest-mpl>=0.17.0"]


[tool.hatch]
metadata.allow-direct-references = true
version.source = "vcs"

# `src/galax` is a PEP 420 namespace directory with no `__init__.py`, so the
# package cannot be auto-detected and must be named explicitly. There is no
# version-file hook: a namespace directory must not hold a module owned by one
# distribution, so `galax.__version__` no longer exists. Use
# `importlib.metadata.version("galax")`.
build.targets.wheel.packages = ["src/galax"]


[tool.codespell]
ignore-words-list = "Hart" # in dynamics/_src/cluster/relax_time.py


[tool.commitizen]
name = "cz_gitmoji"


[tool.coverage]
report.exclude_also = [
  # Have to re-enable the standard pragma
  'pragma: no cover',
  # Ignore type-checking stuff
  '\.\.\.',
  'if TYPE_CHECKING:',
  'if typing.TYPE_CHECKING:',
  # Ignore contents of abstract methods
  '@abc.abstractmethod',
  '@abstractmethod',
]
run.omit = ["*/_boundinstance/*"]
run.source = ["galax"]


[tool.mypy]
python_version = "3.12"

# `src/galax` is a PEP 420 namespace directory. Without an explicit package
# base, mypy derives a module name by walking up to the first directory
# without `__init__.py`, naming this module `potential._src.base` rather than
# `galax.potential._src.base` and losing every cross-module type.
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true

disallow_incomplete_defs = true
disallow_untyped_defs = true
exclude = [
  '(^/)docs/',      # docs
  '(^|/)tests/',    # tests
  '^conftest\.py$', # nox test configuration
]
strict = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

disable_error_code = ["no-redef"]                                            # <- plum multiple dispatch
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
disable_error_code = ["name-defined"] # <- jaxtyping
module = "galax.*"

[[tool.mypy.overrides]]
# `dataclassish.converters.field`'s `**kwargs: DataclassFieldKwargsNotMetadata`
# is missing `Unpack[...]`, so mypy checks each kwarg against the TypedDict
# itself instead of unpacking it. Only bites on py>=3.12, where
# `DataclassFieldKwargsNotMetadata` is a real TypedDict (it's `Any` below 3.12).
disable_error_code = ["arg-type"]
module = [
  "galax.dynamics._src.experimental.df",
  "galax.potential._src.params.field",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "astropy.*",
  "beartype.*",
  "diffrax.*",
  "equinox.*",
  "hypothesis.*",
  "jax.*",
  "jax_cosmo.*",
  "jaxtyping.*",
  "numpy.*",
  "scipy.*",
  "sympy.*",
  "sympy2jax.*",
]


[tool.pylint]
ignore-paths = [".*/_version.py"]
messages_control.disable = [
  "design",
  "fixme",
  "function-redefined",
  "import-outside-toplevel",
  "invalid-name",                  # ruff N80*
  "line-too-long",
  "missing-module-docstring",
  "protected-access",              # ruff SLF001
  "unnecessary-ellipsis",
  "unnecessary-lambda-assignment", # ruff E731
  "unnecessary-pass",              # handled by ruff
  "unused-argument",               # handled by ruff
  "useless-import-alias",
  "wrong-import-order",            # handled by ruff
  "wrong-import-position",
]
py-version = "3.12"
reports.output-format = "colorized"
similarities.ignore-imports = "yes"


[tool.pytest.ini_options]
addopts = [
  "--arraydiff",
  # `src/galax` and `src/galax/interop` are namespace directories. Under the
  # default "prepend" mode pytest derives a module name by walking up to the
  # first directory without an `__init__.py` and puts that directory on
  # sys.path -- which makes the leaf of a namespace package shadow a real
  # library. Matches `coordinax` and `unxt`. NB: deliberately *not*
  # `consider_namespace_packages`, which renames test modules and breaks
  # pytest-mpl's hash lookups.
  "--import-mode=importlib",
  "--showlocals",
  "--strict-config",
  "--strict-markers",
  "-p no:doctest",           # using sybil
  "-ra",
]
filterwarnings = [
  "error",
  "ignore:Attribute s is deprecated:DeprecationWarning",                                             # from Sybil
  "ignore:Passing arguments 'a':DeprecationWarning",                                                 # TODO: from diffrax
  "ignore:ast\\.Str is deprecated:DeprecationWarning",                                               # from Sybil
  "ignore:auto\\-close\\(\\)ing of figures upon backend switching is deprecated:DeprecationWarning",
  "ignore:jax\\.core\\.pp_eqn_rules is deprecated:DeprecationWarning",
  "ignore:numpy\\.ndarray size changed:RuntimeWarning",
  "ignore:The get_name method is deprecated:astropy.utils.exceptions.AstropyDeprecationWarning",     # from gala
  "ignore:unhashable type:FutureWarning",                                                            # TODO: from diffrax
  "ignore:jax\\.interpreters\\.xla\\.pytype_aval_mappings is deprecated:DeprecationWarning",         # from tensorflow-probability[jax]
]
log_cli_level = "INFO"
markers = [
  "serial",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
minversion = "8.0"
testpaths = ["docs", "src/galax", "tests/"]
xfail_strict = true
env = ["JAX_ENABLE_X64=True"]


[tool.ruff]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `*args`
  "COM812",  # Missing trailing comma in Python 3.6+
  "D105",    # Missing docstring in magic method
  "D107",    # Missing docstring in `__init__`
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "E731",    # Do not assign a lambda expression, use a def <- jax
  "E741",    # Ambiguous variable name
  "F722",    # Syntax error in forward annotation  <- jaxtyping
  "F811",    # Redefinition <- plum multiple dispatch
  "F821",    # undefined name  <- jaxtyping
  "FIX002",  # Line contains TODO, consider resolving the issue
  "ISC001",  # Implicit string concatenation <- ruff-format
  "N80",     # Naming conventions.
  "PD",      # pandas-vet
  "PLC0414", # Import alias does not rename original package
  "PLR",     # Design related pylint codes
  "PYI041",  # Use `float` instead of `int | float` <- beartype is more strict
  "RET504",  # Unnecessary variable assignment before return
  "RUF022",  # `__all__` is not sorted
  # "TC00",    # Move into a type-checking block
  "TD002", # Missing author in TODO
  "TD003", # Missing issue link on the line following this TODO
  "UP037", # Remove quote from type annotation  <- jaxtyping
  "UP040", # Use `type` instead of `TypeAlias`  <- plum/beartype can't resolve PEP 695 `type` statements
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]
"__init__.pyi" = ["F401", "F403"]
"docs/conf.py" = [
  "A001",   # Variable `copyright` is shadowing a Python builtin
  "INP001", # implicit namespace package
]
# `galax` and `galax.interop` are PEP 420 namespace directories, so any
# loose module in them is correctly "part of an implicit namespace
# package". That is the intent, not a mistake.
"src/galax/interop/*.py" = ["INP001"]
# Each interop portion is named after the library it wraps, so e.g.
# `galax.interop.astropy.coordinates` importing `astropy.coordinates` looks
# like a self-import. It isn't: these are absolute imports resolving to the
# third-party package. Safe because `--import-mode=importlib` keeps
# `src/galax/interop` off sys.path, so the portion never shadows the library.
"src/galax/interop/*/*.py" = ["PLW0406"]
"notebooks/**" = ["ANN", "D103", "FBT", "T201"]
"noxfile.py" = ["ERA001", "T20"]
"tests/**" = [
  "ANN",
  "ARG001",
  "ARG002",
  "D10",
  "E731",
  "ERA001", # Found commented-out code  # TODO: remove this
  "FBT001", # Boolean-typed positional argument in a function definition
  "INP001",
  "RET504",
  "S101",
  "S301",
  "SLF001",
  "T20",
  "TID252", # Relative imports from parent modules are banned
]

[tool.ruff.lint.flake8-import-conventions]
# `from astropy.coordinates import X` is banned; import the module as `apyc`.
banned-from = ["astropy.coordinates"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"astropy.coordinates" = "apyc"
"coordinax" = "cx"
"diffrax" = "dfx"
"diffraxtra" = "dfxtra"
"equinox" = "eqx"
"functools" = "ft"
"galax.coordinates" = "gc"
"galax.potential" = "gp"
"galax.dynamics" = "gd"
"jax.extend" = "jex"
"optimistix" = "optx"
"unxt" = "u"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = []

[tool.ruff.lint.isort]
combine-as-imports = true
# The interop portions are named after the libraries they wrap, so without this
# isort infers e.g. `astropy` is first-party inside `src/galax/interop/astropy`
# and hoists it into galax's own import block.
known-third-party = ["astropy", "gala", "galpy", "matplotlib"]
known-first-party = [
  "coordinax",
  "dataclassish",
  "diffraxtra",
  "galactic_dynamics_interoperability",
  "is_annotated",
  "oncequinox",
  "optional_dependencies",
  "plotting_backends",
  "quaxed",
  "unxt",
  "xmmutablemap",
  "zeroth",
]
known-local-folder = ["galax"]
section-order = [
  "future",
  "standard-library",
  "typing",
  "third-party",
  "first-party",
  "local-folder",
]
sections = { typing = [
  "typing",
  "typing_extensions",
  "types",
  "collections.abc",
  "jaxtyping",
] }

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.unxt]
quantity.repr.include_params = false
quantity.repr.named_unit = false
quantity.repr.short_arrays = "compact"
quantity.repr.use_short_name = true

quantity.str.include_params = false
quantity.str.named_unit = false
quantity.str.short_arrays = false
quantity.str.use_short_name = true
